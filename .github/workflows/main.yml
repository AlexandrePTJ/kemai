name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          # aqtinstall 3.3.0 (latest release) misses the Qt 6.11 Windows repo layout (miurahr/aqtinstall#1000); drop once released
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Install linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libxcb-screensaver0-dev desktop-file-utils appstream

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release
      
      # Kimai integration tests run only when both secrets are set; empty values make them skip
      - name: Test
        env:
          KEMAI_TEST_HOST: ${{ secrets.KEMAI_TEST_HOST }}
          KEMAI_TEST_TOKEN: ${{ secrets.KEMAI_TEST_TOKEN }}
        run: ctest --preset release --output-on-failure

      # Desktop entry and AppStream metadata (releases generated from CHANGELOG.md) installed on Linux
      - name: Desktop files
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/io.github.AlexandrePTJ.Kemai.desktop
          appstreamcli validate --no-net build/release/code/app/io.github.AlexandrePTJ.Kemai.metainfo.xml

      # qmllint exits 0 on warnings and the Qt-generated target takes no extra args:
      # fail on any "Warning:" line. QML output is platform-independent, Linux is enough.
      - name: QML lint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset release --target Kemai_qmllint 2>&1 | tee qmllint.log
          if grep -q "^Warning:" qmllint.log; then
            echo "::error::qmllint reported $(grep -c '^Warning:' qmllint.log) warning(s)"
            exit 1
          fi
